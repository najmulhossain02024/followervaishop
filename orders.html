<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Order Tracker - Follower Vai Shop</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 pb-24 font-sans select-none">

  <!-- হেডার -->
  <header class="sticky top-0 z-40 bg-white border-b border-slate-200 px-4 py-3 shadow-xs">
    <div class="max-w-md mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <a href="index.html" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center text-xs"><i class="fa-solid fa-arrow-left"></i></a>
        <h1 class="text-sm font-extrabold text-slate-900">আমার অর্ডারসমূহ (Order Track)</h1>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto p-4 space-y-3" id="orders-container">
    <p class="text-center text-xs text-slate-400 py-10">লোড হচ্ছে...</p>
  </main>

  <!-- বটম নেভ -->
  <nav class="fixed bottom-0 left-0 right-0 z-40 bg-white border-t border-slate-200 py-2.5">
    <div class="max-w-md mx-auto grid grid-cols-4 text-center text-[11px]">
      <a href="index.html" class="text-slate-400 flex flex-col items-center gap-1 font-semibold"><i class="fa-solid fa-house text-base"></i> সার্ভিস</a>
      <a href="deposit.html" class="text-slate-400 flex flex-col items-center gap-1 font-semibold"><i class="fa-solid fa-wallet text-base"></i> অ্যাড ফান্ড</a>
      <a href="orders.html" class="text-indigo-600 flex flex-col items-center gap-1 font-bold"><i class="fa-solid fa-box-archive text-base"></i> অর্ডার ট্র্যাক</a>
      <a href="history.html" class="text-slate-400 flex flex-col items-center gap-1 font-semibold"><i class="fa-solid fa-clock-rotate-left text-base"></i> হিস্ট্রি</a>
    </div>
  </nav>

  <script>
    const WORKER_URL = "https://worker.followervai.shop";
    let currentUser = JSON.parse(localStorage.getItem("fv_user")) || null;

    window.onload = async () => {
      if (!currentUser) {
        alert("দয়া করে লগইন করুন!");
        window.location.href = "index.html";
        return;
      }
      loadOrders();
    };

    async function loadOrders() {
      const container = document.getElementById("orders-container");
      try {
        const res = await fetch(`${WORKER_URL}/api/user/orders?identifier=${encodeURIComponent(currentUser.identifier)}`);
        const data = await res.json();
        container.innerHTML = "";

        if (data.orders.length === 0) {
          container.innerHTML = `
            <div class="text-center py-16 space-y-2">
              <i class="fa-solid fa-box-open text-3xl text-slate-300"></i>
              <p class="text-xs text-slate-400 font-semibold">কোন অর্ডার পাওয়া যায়নি</p>
            </div>
          `;
          return;
        }

        data.orders.forEach(o => {
          let badgeColor = "bg-amber-50 text-amber-600 border-amber-200";
          if (o.status === 'completed') badgeColor = "bg-emerald-50 text-emerald-600 border-emerald-200";
          if (o.status === 'cancelled') badgeColor = "bg-red-50 text-red-600 border-red-200";

          container.innerHTML += `
            <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-xs space-y-2">
              <div class="flex justify-between items-center">
                <span class="text-xs font-black text-indigo-700 font-mono">${o.order_code}</span>
                <span class="text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-full border ${badgeColor}">${o.status}</span>
              </div>
              <h4 class="text-xs font-bold text-slate-800">${o.service_title}</h4>
              <p class="text-[11px] text-slate-400 truncate">টার্গেট: <a href="${o.target_link}" target="_blank" class="text-indigo-600 underline">${o.target_link}</a></p>
              ${o.custom_comments ? `<p class="text-[10px] bg-slate-50 p-2 rounded-lg text-slate-600 font-mono">কমেন্ট: ${o.custom_comments.replace(/\n/g, ', ')}</p>` : ''}
              <div class="flex justify-between items-center pt-1 border-t border-slate-100 text-xs">
                <span class="text-slate-400">পরিমাণ: <b class="text-slate-700">${o.quantity}</b></span>
                <span class="text-slate-400">খরচ: <b class="text-slate-900">৳${o.charge}</b></span>
              </div>
            </div>
          `;
        });
      } catch (e) {
        container.innerHTML = `<p class="text-center text-xs text-red-400">ডাটা লোড ব্যর্থ!</p>`;
      }
    }
  </script>
</body>
</html>
